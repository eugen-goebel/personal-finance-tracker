[project]
name = "personal-finance-tracker"
version = "1.0.0"
description = "Personal finance tracking with a Streamlit dashboard, a FastAPI service and MT940 or OFX statement import"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "pandas>=3.0.5",
    "numpy>=2.5.2; python_version >= '3.12'",
    "numpy>=2.4.6,<2.5.0; python_version < '3.12'",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "mt-940>=5.0.0",
    "ofxparse>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    # fastapi.testclient builds on httpx, only the test suite needs it
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
# B008: FastAPI's Depends()/File() default-argument idiom is intentional
ignore = ["E501", "B008"]
